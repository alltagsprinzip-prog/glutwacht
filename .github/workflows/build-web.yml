name: Build and Deploy Glutwacht Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Import project
        run: godot --headless --editor --path . --import

      - name: Headless startup check
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee godot-start.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-start.log; then
            echo "Godot script error detected"
            exit 1
          fi

      - name: Gameplay release gate
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests3d/release_gate.gd 2>&1 | tee release-gate.log
          grep -q "RELEASE_GATE_OK" release-gate.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|RELEASE GATE:" release-gate.log; then
            echo "Gameplay release gate failed"
            exit 1
          fi

      - name: Export Web
        shell: bash
        run: |
          set -o pipefail
          BUILD_DIR="dist/v08final"
          mkdir -p "$BUILD_DIR"
          godot --headless --path . --export-release "Web" "$BUILD_DIR/index.html" 2>&1 | tee godot-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-export.log; then
            echo "Godot script error detected during export"
            exit 1
          fi
          test -f "$BUILD_DIR/index.html"
          test -f "$BUILD_DIR/index.wasm"
          test -f "$BUILD_DIR/index.pck"
          touch dist/.nojekyll
          cat > dist/index.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./v08final/">
          <title>Glutwacht</title>
          <a href="./v08final/">Glutwacht starten</a>
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path("dist/v08final/index.html")
          s=p.read_text()
          marker='</body>'
          overlay=r'''
          <div id="gw-start-watch" style="position:fixed;left:12px;bottom:12px;z-index:99999;background:#12212a;color:#fff;padding:9px 12px;border-radius:8px;font:14px sans-serif">Glutwacht lädt…</div>
          <script>
          (() => {
            const box=document.getElementById('gw-start-watch');
            const fail=(m)=>{ if(box){ box.textContent='Startfehler: '+m; box.style.background='#7a2828'; } };
            window.addEventListener('error',e=>fail(e.message||'JavaScript-Fehler'));
            window.addEventListener('unhandledrejection',e=>fail(String(e.reason||'Unbekannter Fehler')));
            const timer=setInterval(()=>{ if(window.__glutwacht){ clearInterval(timer); if(box) box.remove(); } },500);
            setTimeout(()=>{ if(!window.__glutwacht && box && !box.textContent.startsWith('Startfehler')) box.textContent='Spielstart dauert länger als erwartet…'; },12000);
          })();
          </script>
          '''
          p.write_text(s.replace(marker,overlay+marker))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
