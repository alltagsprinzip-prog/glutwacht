name: Verify Apple TestFlight status
on:
  workflow_dispatch:
  push:
    branches: [update/masterplan-online-20260925]
    paths: ['.github/workflows/check-testflight.yml', 'tools/check_testflight.py']
permissions:
  contents: read
jobs:
  apple-status:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read processing state and assigned test groups
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GLUTWACHT: ${{ secrets.GLUTWACHT }}
          TARGET_VERSION: '0.14.0'
          TARGET_BUILD: '9.0.0'
        run: python3 tools/check_testflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-testflight-status
          path: apple-status.json
          retention-days: 14
