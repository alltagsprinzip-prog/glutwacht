name: HUD review workspace
on:
  push:
    branches: [update/hud-review-20260925]
    paths: [.github/workflows/hud-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export exact source and pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hud-workspace
          git archive --format=tar HEAD | gzip -1 > /tmp/hud-workspace/source.tar.gz
          git rev-parse HEAD > /tmp/hud-workspace/BASE_COMMIT.txt
          curl --fail --location --retry 2 -o /tmp/hud-workspace/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/hud-workspace/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version > /tmp/hud-workspace/GODOT_VERSION.txt
          curl --fail --location --retry 2 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -p /tmp/templates.tpz templates/web_nothreads_release.zip > /tmp/hud-workspace/web_nothreads_release.zip
          unzip -p /tmp/templates.tpz templates/web_nothreads_debug.zip > /tmp/hud-workspace/web_nothreads_debug.zip
          cd /tmp/hud-workspace && sha256sum source.tar.gz godot.zip web_nothreads_release.zip web_nothreads_debug.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hud-workspace
          path: /tmp/hud-workspace
          retention-days: 7
          compression-level: 0
