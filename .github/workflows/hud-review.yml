name: HUD review validation
on:
  push:
    branches: [update/hud-review-20260925]
    paths:
      - .review/hud-ready.json
      - game3d/**
      - assets3d/**
      - tests3d/**
      - tools/browser_review.py
      - .github/workflows/hud-review.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glutwacht-hud-review
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hud-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: hud-workspace
          run-id: 36121811351
          github-token: ${{ github.token }}
          path: /tmp/hud-toolchain
      - name: Reconcile reviewed source and preserve newer fixes
        id: source
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/hud-toolchain && sha256sum -c SHA256SUMS.txt)
          if test -f .review/hud-ready.json; then
            python3 .review/apply_hud_reconciled.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add PROJECT_STATE.md assets3d game3d tests3d tools docs/HUD_REVIEW_2026-09-25.md docs/HUD_CONTINUATION_ARCHIVE.md .review
            git commit -m 'Implement HUD review: readable controls, protected saves and distinct abilities'
            git push origin HEAD:refs/heads/update/hud-review-20260925
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install exact verified engine and templates
        shell: bash
        run: |
          set -euo pipefail
          unzip -q /tmp/hud-toolchain/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          ln -s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp /tmp/hud-toolchain/web_nothreads_*.zip "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import and start without script errors
        run: |
          python3 tools/check_godot.py logs/import.log godot --headless --editor --path . --import
          python3 tools/check_godot.py logs/start.log godot --headless --audio-driver Dummy --path . --quit-after 120
      - name: Existing gameplay and new save/ability regressions
        run: |
          python3 tools/check_godot.py logs/rules.log godot --headless --path . --script tests3d/release_suite.gd
          python3 tools/check_godot.py logs/upstream.log godot --headless --path . --script tests3d/release_gate.gd
          python3 tools/check_godot.py logs/hud-rules.log godot --headless --path . --script tests3d/hud_rules.gd
      - name: Native rendered touch and HUD review
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: |
          mkdir -p logs/screenshots
          python3 tools/check_godot.py logs/input.log xvfb-run -a -s '-screen 0 1280x720x24' godot --audio-driver Dummy --path . --script tests3d/input_suite.gd
          GLUTWACHT_QA_DIR="$PWD/logs/screenshots" python3 tools/check_godot.py logs/hud.log xvfb-run -a -s '-screen 0 1280x720x24' godot --audio-driver Dummy --path . --script tests3d/hud_review.gd
          python3 tools/check_godot.py logs/visual.log xvfb-run -a -s '-screen 0 1280x720x24' godot --audio-driver Dummy --path . --script tests3d/visual_release.gd
      - name: Export isolated preview
        run: |
          mkdir -p dist/hud-review
          python3 tools/check_godot.py logs/export.log godot --headless --path . --export-release Web dist/hud-review/index.html
          python3 tools/web_bootstrap.py dist/hud-review
          printf '{"source_commit":"%s","review":"HUD-2026-09-25"}\n' "${{ steps.source.outputs.sha }}" > dist/hud-review/build-info.json
      - name: Browser WebGL and actual IndexedDB verification
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chrome
          python3 tools/browser_review.py dist
      - name: Include render evidence and export code backup
        if: always()
        run: |
          mkdir -p delivery logs
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('.')
          with zipfile.ZipFile('delivery/Glutwacht_HUD_Code.zip','w',zipfile.ZIP_DEFLATED) as z:
            for folder in ['game3d','scripts','tests3d','tools','assets3d/icons','assets3d/ui']:
              for f in (root/folder).rglob('*'):
                if f.is_file() and not f.name.endswith('.pyc'):z.write(f,str(f))
            for f in ['project.godot','export_presets.cfg','PROJECT_STATE.md','docs/HUD_REVIEW_2026-09-25.md']:
              if pathlib.Path(f).exists():z.write(f,f)
          PY
          cp -r logs delivery/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-review-evidence
          path: delivery
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-review-web
          path: dist
          retention-days: 30
      - name: Preserve existing published Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 36066263187
          github-token: ${{ github.token }}
          path: /tmp/existing-pages
      - name: Add preview without altering existing site files
        run: |
          mkdir -p publish
          python3 - <<'PY'
          import hashlib,pathlib,shutil,tarfile,urllib.request
          with tarfile.open('/tmp/existing-pages/artifact.tar') as t:t.extractall('publish',filter='data')
          root=pathlib.Path('publish')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          with urllib.request.urlopen('https://alltagsprinzip-prog.github.io/glutwacht/',timeout=30) as response:live=response.read()
          assert live==(root/'index.html').read_bytes(),'Published entry changed; refuse to replace with an older artifact'
          assert not (root/'hud-review').exists(),'Preview already exists: explicit new approval required'
          shutil.copytree('dist/hud-review',root/'hud-review')
          shutil.copytree('logs/screenshots',root/'hud-review/screenshots')
          for name,digest in before.items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
  preview:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}hud-review/
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
