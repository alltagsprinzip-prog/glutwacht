name: Browser decoded gzip regression
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gzip-account:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p dist/v08
          godot --headless --editor --path . --import
          python3 tools/check_godot.py logs/gzip-export.log godot --headless --path . --export-release Web dist/v08/index.html
          python3 tools/web_bootstrap.py dist/v08
          npm install --prefix "$RUNNER_TEMP/gzip-browser" --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/gzip-browser/node_modules/playwright/cli.js" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/gzip-browser/node_modules" node tools/web_compression.cjs
