[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="game3d/online/config.json"
exclude_filter="backend/*,dist/*,tests/*,tests3d/*,docs/*,tools/*,README.md,PROJECT_STATE.md,.openai/*,assets3d/nature/*.png"
export_path="dist/index.html"
[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
[preset.1]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="game3d/online/config.json"
exclude_filter="backend/*,dist/*,tests/*,tests3d/*,docs/*,tools/*,README.md,PROJECT_STATE.md,.openai/*"
export_path="../builds/Glutwacht.x86_64"
[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.2]
name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
include_filter="game3d/online/config.json"
exclude_filter="backend/*,dist/*,builds/*,tests/*,tests3d/*,docs/*,tools/*,README.md,PROJECT_STATE.md,.openai/*,assets3d/nature/*.png"
export_path="builds/ios/Glutwacht.zip"
[preset.2.options]
application/app_store_team_id=""
application/bundle_identifier="com.moratgalla.glutwacht"
application/short_version="0.12.0"
application/version="1.0.0"
application/min_ios_version="16.0"
application/export_project_only=true
architectures/arm64=true
capabilities/access_wifi=false
entitlements/game_center=false
entitlements/push_notifications=""
